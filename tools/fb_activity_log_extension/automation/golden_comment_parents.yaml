# Golden set for FB comment parent-enrichment (enrich_comment_parents.py).
#
# Ground truth read INDEPENDENTLY from the rendered permalink comment thread
# (the parent comment article / post body a human sees), not from any cached
# scrape. Validate:
#   uv run --no-project --with websocket-client --with pyyaml \
#     enrich_comment_parents.py --golden automation/golden_comment_parents.yaml
# It opens each permalink, runs the extraction, and asserts kind + parent_author
# + parent_text_contains + reply_text_contains. When extraction disagrees, fix
# the extension/script — not this file.
#
# Captured 2026-06-13 (account vyakunin / "Vladimir Yakunin"). Note pfbid in the
# permalink can drift per session; re-capture if a fetch 404s.

entries:
  # reply-to-comment on HIS OWN post — the new own-post pair case.
  - permalink: "https://www.facebook.com/vyakunin/posts/pfbid0cnLfcM2r1nuMXq3FNpdit6UxZt9gm2v2u6qqpkG1VEKPA5fiVGbPn6veHVEZ3G5rl?comment_id=1899818014030798"
    kind: reply_to_comment
    parent_author: "Ines Saroman"
    parent_text_contains: "The melon part doesn't work"
    reply_text_contains: "уточню у моего британца"

  # comment-on-post on someone ELSE's post (parent = the post body). Extraction
  # of this kind is best-effort; included to track when it works.
  - permalink: "https://www.facebook.com/mike.tamm.9/posts/pfbid0g6zAsrPHf6sTFFnZw4PQkCtLphXbSc6wDP8hFkz8RBHKGLwj4PiKmKwfGPRUfFmJl?comment_id=1258575436443136"
    kind: comment_on_post
    parent_author: "Mike Tamm"
    parent_text_contains: "Five million people were seized"
    reply_text_contains: "А неверно, что угоняют"

  # self-reply (reply_comment_id points to HIS OWN comment) on someone else's
  # post. Captured 2026-06-15. Regression for 3 bugs found live that day:
  #   1. kind was misclassified comment_on_post (aria said "Comment by", not
  #      "Reply by"); reply_comment_id in the URL is the authoritative signal.
  #   2. parentAuthor leaked the title's "(N)" unread badge ("(1) Michael Genin").
  #   3. replyText kept trailing chrome ("6y Like Reply Edited") — clean() now
  #      collapses whitespace before the dotAll-unaware trailing regex.
  # A self-reply's parent resolves UP to the first non-self ancestor — here the
  # post — so the pair is (Michael Genin's post -> his reply), not a self-pair.
  - permalink: "https://www.facebook.com/misha.genin/posts/pfbid0FAHFjah1E5PTNja7FHbs4c2GhyiZgk2BG9x7uBkUgfwFKxGUURBrUHNRS45fHPt5l?comment_id=10220757606987974&reply_comment_id=10220757675909697"
    kind: reply_to_comment
    parent_author: "Michael Genin"
    parent_text_contains: "сверхпрочной стали"
    reply_text_contains: "пристегнут ремнями вдали от ее краев"

  # reply-to-comment where FB renders the permalink as a MODAL that does NOT emit
  # the target comment_id as an anchor (verified 2026-06-17: his comment present
  # with a correct "Reply by Vladimir Yakunin to …'s comment" aria-label but zero
  # target-cid anchors in the dialog — the 4647-record pending tail). The finder
  # falls back to matching his comment by author aria-label + the known reply body
  # (comments.json text → _body_of). Regression for the 2026-06-17 fix; the parent
  # "Hide" moderation-chrome strip is also exercised here.
  - permalink: "https://www.facebook.com/photo/?fbid=7578867062128646&set=a.104013769614050&comment_id=773715467816952&reply_comment_id=1273293783393600"
    kind: reply_to_comment
    parent_author: "Anna Chubinska"
    parent_text_contains: "Тот редкий случай, когда Вова улыбается на фото"
    reply_text_contains: "я скорее всего не осознавал, что Иван задумал"
    my_text: "Vladimir Yakunin replied to Anna Chubinska's comment. Anna Chubinska я скорее всего не осознавал, что Иван задумал Public 8:25 AM View"
